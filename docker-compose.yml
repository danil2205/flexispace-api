services:
  api:
    container_name: flexispace-api
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - AWS_ENDPOINT=http://minio:9000
    depends_on:
      - postgres
      - minio
      - redis
  postgres:
    image: postgres:alpine
    container_name: flexispace-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flexispace
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: flexispace-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  redis:
    image: redis:alpine
    container_name: flexispace-redis
    ports:
      - '6379:6379'

volumes:
  postgres_data:
  minio_data:
